[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elwis-exam-parser"
version = "0.1.0"
description = "Extract, validate, and export official German ELWIS sport-boat exam catalogs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
    { name = "Carlos von Hoyningen-Huene" }
]
keywords = [
    "elwis",
    "python",
    "pdf",
    "parser",
    "boating",
    "exam"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]
dependencies = [
    "PyMuPDF>=1.24,<2",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2"
]

[project.scripts]
elwis-parser = "elwis_parser.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/elwis_parser"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "integration: needs the official ELWIS PDFs in data/sources",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
# The formatter does not reflow annotated signatures, so the length target
# stays in force for formatting while E501 is not a separate failure.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["elwis_parser"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["elwis_parser"]

[[tool.mypy.overrides]]
module = ["pymupdf", "fitz", "bs4", "bs4.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "elwis_parser.pdf.backend",
    "elwis_parser.pdf.images",
    "elwis_parser.pdf.extractor",
    "elwis_parser.cli",
    "elwis_parser.sources.html_links",
]
disallow_untyped_calls = false
